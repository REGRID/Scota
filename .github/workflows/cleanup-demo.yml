name: Midnight Cleanup Expired Demo Tenants

on:
  schedule:
    - cron: "5 17 * * *" # 00:05 WIB (UTC+7) = 17:05 UTC
  workflow_dispatch:

jobs:
  cleanup:
    name: Purge Expired Demo Data
    runs-on: ubuntu-latest
    steps:
      - name: Purge Expired Demo Data via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/scota
            node scripts/cleanup-demo-tenants.js
