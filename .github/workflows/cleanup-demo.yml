name: Midnight Cleanup Expired Demo Tenants

on:
  schedule:
    - cron: "5 17 * * *" # 00:05 WIB (UTC+7) = 17:05 UTC
  workflow_dispatch:

jobs:
  cleanup:
    name: Purge Expired Demo Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install PostgreSQL Client Dependencies
        run: npm install pg --no-audit

      - name: Run Cleanup Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/cleanup-demo-tenants.js
